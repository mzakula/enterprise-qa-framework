# The display name of the workflow as it appears in the GitHub Actions tab
name: Playwright Tests

# Defines the trigger (event) that kicks off this automated workflow
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Group of one or more jobs that run in this workflow
jobs:
  # Unique identifier for the job
  test:

    # The type of virtual machine (runner) the job will execute on
    # ubuntu-latest provisions a fresh Linux environment hosted by GitHub
    runs-on: ubuntu-latest

    # Strategy allows creating a matrix of job configurations
    strategy:
      matrix:
        # Defines a variable 'browser' with two values. 
        # This will spin up TWO separate, parallel jobs: one for chromium, one for firefox.
        browser: [chromium, firefox]

    # The sequence of tasks (steps) to be executed in this job
    steps:

      # Step 1: Clones your repository code onto the runner VM so the pipeline can access it
      # Uses the official GitHub Checkout action (version 4)
      - uses: actions/checkout@v4

      # Step 2: Sets up a Node.js environment on the runner VM
      - uses: actions/setup-node@v4
        with:
          # Specifies the exact Node.js version to use (Version 20 is a stable LTS release)
          node-version: 20
          # Use built-in npm caching to speed up dependency installs across runs
          cache: 'npm'

      # Step 3: Installs the project dependencies listed in your package.json file
      - name: Install Dependencies
        # Use `npm ci` for reproducible installs in CI and faster execution
        run: npm ci --prefer-offline --no-audit --no-progress

      # Step 4: Cache Playwright browser binaries to speed up repeated CI runs.
      # This saves time when Playwright restarts on a fresh runner for each matrix job.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browser-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-browser-cache-${{ runner.os }}-

      # Step 5: Installs the actual browser binaries required by Playwright
      # The '--with-deps' flag tells it to also install any missing operating system dependencies
      - name: Install Browsers
        run: npx playwright install --with-deps

      # Step 5: Executes your Playwright test suite
      # Because of the matrix strategy above, Playwright will automatically target the correct browser
      # Forward DB secrets into Playwright so the database integration tests can connect when run in CI.
      # These values must be configured in GitHub repo secrets under Settings -> Secrets.
      - name: Run Tests
        # Inject secrets and environment variables for CI runs.
        # Also pass BASE_URL from secrets to avoid hard-coded endpoints in CI.
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          BASE_URL: ${{ secrets.BASE_URL }}     
        # Run Playwright for the specific browser from the matrix so each job
        # only runs one browser (true matrix execution). This avoids duplicating
        # browser runs inside Playwright's own project list.
        run: |
          npx playwright test --project=${{ matrix.browser }}

      # Upload artifacts per matrix axis so HTML reports and raw results are
      # preserved and downloadable from the workflow run.
      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results

      # Upload traces/supplementary test-results only on failure to save space
      - name: Upload Traces and Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.browser }}
          path: test-results/

      # Small summary added to the GitHub Actions run summary for quick browsing
      - name: Publish Test Summary
        if: always()
        run: |
          echo "## Test Execution" >> $GITHUB_STEP_SUMMARY
          echo "- Browser: ${{ matrix.browser }}" >> $GITHUB_STEP_SUMMARY
      # End of Playwright matrix steps

  # Run Newman/Postman once after the Playwright matrix completes.
  # This job depends on the `test` job so it will only run after the
  # matrix finishes. Keeping Newman in a separate job prevents duplicate
  # Newman executions across matrix axes (chromium/firefox).
  postman:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        # Install Newman and the HTML reporter so we can produce an HTML report
        run: npm install -g newman newman-reporter-html

      - name: Run Postman Tests (produce HTML report)
        env:
          # Allow CI to override base URL via secrets if configured
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          # Run the exported Postman collection once using the QA environment
          # Produce both CLI output and an HTML report for easy review.
          newman run ./postman/collections/DummyJSON_Regression_Collection.json \
            -e ./postman/environments/DummyJSON_QA_Environment.json \
            -r cli,html --reporter-html-export newman-report.html || true

      - name: Upload Newman HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.html
      # Run API regression coverage with Newman using the exported Postman collection and environment.
      # NOTE: Postman/Newman was running inside the matrix which caused it
      # to execute once per browser (duplicate runs). This step was removed
      # from the matrix job and moved to a single dedicated `postman` job
      # below so Newman runs only once after the Playwright matrix completes.